site_name: FinAdvisor
# TODO: set site_url to the production URL when deploying
site_url: ""
site_description: Quantitative trading & investment analytics platform
# TODO: replace with actual repo URL
repo_url: https://github.com/your-org/finn-help
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
            docstring_style: numpy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - API Reference: api/
  - Modules:
      - Analysis: modules/analysis.md
      - Collectors: modules/collectors.md
      - Trading: modules/trading.md
      - Alerts: modules/alerts.md
      - LLM: modules/llm.md
      - Scheduler: modules/scheduler.md
  - Deployment: deployment.md
  - Development: development.md
