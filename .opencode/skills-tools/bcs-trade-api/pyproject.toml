[project]
name = "bcs-trade-api"
version = "0.1.0"
description = "Portable CLI skill for BCS Broker trade API"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "live: hits the real BCS API; needs a valid refresh token",
]
