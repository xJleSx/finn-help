name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.13"
  DATABASE_URL: "sqlite:///data/test.db"
  JWT_SECRET: "ci-test-secret"
  LOG_LEVEL: WARNING

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff check (focused)
        run: uv run ruff check --output-format=github src/analysis/ml/ src/collectors/ src/cli/ tools/
      - name: Ruff format check
        run: uv run ruff format --check
      - name: MyPy
        run: uv run mypy src/cli/commands/data.py src/analysis/ml/_base.py src/analysis/ml/pooled.py src/collectors/moex.py src/collectors/base.py src/constants.py src/config.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Create data dir and env
        run: |
          mkdir -p data
          echo "DATABASE_URL=${{ env.DATABASE_URL }}" > .env
          echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> .env
          echo "LOG_LEVEL=${{ env.LOG_LEVEL }}" >> .env
      - name: Quick tests
        run: uv run pytest tests/test_config.py tests/test_constants.py tests/test_connection.py tests/test_types.py -x -v
      - name: ML tests
        run: uv run pytest tests/test_ml.py tests/test_backtest.py -x -v
