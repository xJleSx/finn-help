[project]
name = "finn-help"
version = "0.1.0"
description = "AI financial advisor for MOEX markets"
license = "BUSL-1.1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "t-tech-investments>=1.49",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "networkx>=3.0",
    "groq>=1.4.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-telegram-bot>=22.8",
    "sse-starlette>=2.0",
    "xgboost>=3.2.0",
    "scikit-learn>=1.9.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.0",
    "statsmodels>=0.14.0",
    "alembic>=1.18.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "cloudpickle>=3.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "structlog>=25.0.0",
    "prometheus-client>=0.25.0",
    "tenacity>=9.0.0",
    "sentry-sdk>=2.0",
    "mlflow>=2.15.0",
    "celery>=5.5.0",
    "cryptography>=42.0.0",
    "lxml>=6.1.1",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.scripts]
finn = "src.cli:app"

[tool.uv]
package = true

[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "pip-audit>=2.7.0",
    "testcontainers>=4.0.0",
    "hypothesis>=6.100.0",
    "syrupy>=4.7.0",
]
ci = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
]
loadtest = [
    "locust>=2.32.0",
]
ml = [
    "torch>=2.3.0",
    "transformers>=4.38.0",
    "sentence-transformers>=5.6.0",
]

[tool.pytest.ini_options]
timeout = 60
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 75
exclude_also = [
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
show_error_codes = true
warn_unused_ignores = true
exclude = ["tests/", "alembic/"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["telegram.*", "telegram.ext.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["catboost.*", "lightgbm.*", "xgboost.*", "prophet.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.tasks.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.analysis.ml.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.analysis.anomaly.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.trading.brokers.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.collectors.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.interfaces.telegram.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.interfaces.telegram_guard", "src.interfaces.telegram_alerter", "src.interfaces.telegram_broadcaster"]
ignore_errors = true

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "R", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "SIM", "R", "PLC0415"]
"src/interfaces/telegram/*" = ["S"]
"tools/*" = ["PLC0415", "R", "E402"]
"src/**/__init__.py" = ["PLC0415"]
"src/notifications/*" = ["S311", "S701"]
"src/cache.py" = ["S324"]
"src/collectors/alternative.py" = ["S314"]
"src/collectors/cbr.py" = ["S314", "S101"]
"alembic/*" = ["S608"]

[tool.ruff.format]
line-ending = "auto"
