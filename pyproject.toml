[project]
name = "finn-help"
version = "0.1.0"
description = "AI financial advisor for MOEX markets"
license = "BUSL-1.1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "networkx>=3.0",
    "groq>=1.4.0",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-telegram-bot>=22.8",
    "sse-starlette>=2.0",
    "xgboost>=3.2.0",
    "scikit-learn>=1.9.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.0",
    "statsmodels>=0.14.0",
    "alembic>=1.18.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "redis>=5.0",
    "cloudpickle>=3.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "structlog>=25.0.0",
    "prometheus-client>=0.25.0",
    "tenacity>=9.0.0",
    "sentry-sdk>=2.0",
    "mlflow>=2.15.0",
    "celery>=5.5.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.scripts]
finn = "src.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "pytest-cov>=6.0.0",
    "pip-audit>=2.7.0",
]
ml = [
    "torch>=2.3.0",
    "transformers>=4.38.0",
    "sentence-transformers>=5.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 60
exclude_also = [
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
show_error_codes = true
warn_unused_ignores = true
exclude = ["tests/", "alembic/"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["src.interfaces.api.auth", "src.interfaces.api.routes_portfolio", "src.portfolio.service", "src.cache"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "statsmodels.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["telegram.*", "telegram.ext.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.interfaces.telegram", "src.interfaces.api.server"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src.interfaces.response_formatter",
    "src.data.news_classifier",
    "src.trading.execution.loop",
    "src.analysis.anomaly.autoencoder",
    "src.data.batch_processor",
    "src.interfaces.nlq",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.tasks.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.scheduler.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.portfolio.allocator"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src.interfaces.api.routes.trading_v2",
    "src.interfaces.api.routes.analysis",
    "src.interfaces.api.routes.paper_trading",
    "src.interfaces.api.routes.alert_preferences",
    "src.alerts.smart",
    "src.trading.execution.engine",
    "src.trading.execution.stoploss",
    "src.trading.execution.audit",
    "src.trading.paper",
    "src.data.news_processor",
    "src.data.news_system",
    "src.data.sector_impact_engine",
    "src.data.news_clusterer",
    "src.data.dashboard_provider",
    "src.data.event_detector",
    "src.data.impact_matrix",
    "src.data.geopolitical_risk_engine",
    "src.data.sector_mapper",
    "src.analysis.summarizer",
    "src.analysis.ml.*",
    "src.analysis.rebalancing",
    "src.analysis.risk_explorer",
    "src.analysis.ml_coordinator",
    "src.analysis.feature_drift",
    "src.analysis.optimizer",
    "src.analysis.anomaly.*",
    "src.analysis.attribution",
    "src.analysis.feature_store",
    "src.trading.brokers.*",
    "src.trading.compliance.*",
    "src.core.health",
    "src.core.http_client",
    "src.core.logging",
    "src.data.company_risk_aggregator",
    "src.notifications.service",
    "src.notifications.channels",
    "src.notifications.retry",
    "src.interfaces.telegram_guard",
    "src.interfaces.telegram_alerter",
    "src.interfaces.telegram_broadcaster",
    "src.collectors.*",
    "src.llm.*",
    "src.model_registry",
    "src.db.models",
    "src.config",
    "src.market.service",
]
ignore_errors = true



[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "auto"
