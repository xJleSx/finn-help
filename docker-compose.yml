services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finn
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: finn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: finn
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: finn
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-25}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_CONNECTIONS:-50}
      SERVER_IDLE_TIMEOUT: 600
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - finn_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    stop_grace_period: 30s
    stop_signal: SIGTERM
    environment:
      - DATABASE_URL=postgresql://finn:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/finn
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FINN_ENV=production
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.tasks worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}
    environment:
      - DATABASE_URL=postgresql://finn:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/finn
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
      - LOG_LEVEL=INFO
      - FINN_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    volumes:
      - finn_data:/app/data
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.tasks beat --loglevel=INFO --scheduler celery.beat.PersistentScheduler
    environment:
      - DATABASE_URL=postgresql://finn:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/finn
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
      - LOG_LEVEL=INFO
      - FINN_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
    volumes:
      - finn_data:/app/data
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - finn_prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - finn_grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    ports:
      - "127.0.0.1:5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://finn:${DB_PASSWORD:?DB_PASSWORD is required}@pgbouncer:5432/finn
      --default-artifact-root /mlflow/artifacts
      --artifacts-destination /mlflow/artifacts
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - finn_mlflow:/mlflow
    depends_on:
      pgbouncer:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

volumes:
  finn_postgres:
  finn_redis:
  finn_data:
  finn_prometheus:
  finn_grafana:
  finn_mlflow:
