services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finn
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: finn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finn"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: finn
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: finn
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-25}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_CONNECTIONS:-50}
      SERVER_IDLE_TIMEOUT: 600
    ports:
      - "127.0.0.1:5433:5432"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - finn_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://finn:${DB_PASSWORD:-finn}@pgbouncer:5432/finn
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FINN_ENV=production
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=10
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Celery worker/beat — зарезервировано для фоновых ML-задач.
  # Основной планировщик работает внутри процесса API (src/scheduler/service.py).
