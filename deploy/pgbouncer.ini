[databases]
finn-help = host=db port=5432 dbname=finn-help

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5433
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 25
max_client_conn = 200
max_db_connections = 50
server_idle_timeout = 600
query_timeout = 30
stats_period = 60
application_name_add_host = 1
